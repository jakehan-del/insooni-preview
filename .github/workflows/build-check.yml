name: 파생본·검증

# 왜 있는가
# ---------
# HTML 이 읽는 것은 style.min.css / main.min.js 다. 원본만 고치고 build.py 를
# 안 돌리면 라이브는 하나도 안 바뀐다 — 파일은 고쳤는데 화면은 그대로다.
# 캐시 무효화 값도 예전엔 손으로 올려야 했다(지금은 build.py 가 내용 해시로 찍는다).
# 그 순서를 사람이 기억하지 않아도 되게 한다.
#
# 순서가 중요하다: 만들고 → 재고 → 통과해야 커밋한다.
# 커밋을 먼저 하면 깨진 것이 이미 라이브에 올라간 뒤에 빨간불이 켜진다.
# 그래서 한 job 안에서 순서대로 한다. checkout 을 두 번 하면 그 사이에
# 다른 워크플로가 밀어 넣은 커밋을 검증하게 될 수도 있다.

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "*.html"
      - "scripts/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-check
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 파생본과 캐시 무효화 해시 다시 만들기
        run: python3 scripts/build.py

      - name: 브라우저 준비
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: 사이트 띄우기
        run: |
          python3 -m http.server 8877 >/dev/null 2>&1 &
          for i in $(seq 1 25); do
            curl -sf http://127.0.0.1:8877/index.html >/dev/null && exit 0
            sleep 1
          done
          echo "로컬 서버가 안 떴습니다"; exit 1

      # 여기서 실패하면 다음 단계가 안 돈다 = 깨진 것이 커밋되지 않는다.
      - name: 대비·가로넘침·콘솔오류 (글자 17px·21px × 폰·데스크)
        run: python3 scripts/verify.py

      - name: 통과했으면 커밋
        run: |
          git config user.name  "insooni-bot"
          git config user.email "actions@users.noreply.github.com"
          # git diff 는 '새로 생긴' 파일을 못 본다. build.py 가 새 .min 을 만들면
          # untracked 라 diff 에 안 잡혀 커밋 없이 끝났다(실제 버그).
          # status --porcelain 은 추적·미추적을 다 본다.
          if [ -z "$(git status --porcelain)" ]; then
            echo "파생본이 이미 최신입니다"
            exit 0
          fi
          git add -A
          git commit -m "chore: 파생본·캐시 무효화 자동 갱신 [skip ci]"
          # 자동 갱신 워크플로와 밀어넣기가 겹칠 수 있다. 몇 번 다시 시도한다 —
          # 한 번 부딪혔다고 빨간불을 켜면 다음 사람이 그 빨간불을 무시하게 된다.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          echo "밀어넣기 실패"; exit 1
