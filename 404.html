<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<!-- 주의: 배포 루트 변경 시 아래 절대 경로(/insooni-preview/) 수정 필요 -->
<title>페이지를 찾을 수 없습니다 | 인순이 INSOONI</title>
<link rel="icon" type="image/svg+xml" href="https://insooni.com/assets/img/favicon.svg">
<style>
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
         background:#080808; color:#F3EFE7; font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",sans-serif; text-align:center;
         background-image: radial-gradient(60% 75% at 78% 18%, rgba(243,239,231,.07), transparent 60%); }
  .wrap { padding: 2rem; }
  p.code { font-family:"Space Mono","IBM Plex Mono",monospace; font-size:.76rem; letter-spacing:.22em; color:#F3EFE7; margin:0 0 1.2rem; }
  h1 { font-size: clamp(1.8rem, 5vw, 3rem); font-weight:900; margin:0 0 .6em; }
  p.desc { font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; color:#b3a99c; margin:0 0 2.2rem; }
  a { display:inline-block; padding:.8em 2em; border-radius:2px; background:#F3EFE7; color:#080808;
      font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", system-ui, sans-serif; font-weight:700; text-decoration:none; }
</style>
<meta name="robots" content="noindex,follow">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="description" content="찾으시는 페이지가 없습니다. 인순이 공식 팬 플랫폼 홈으로 돌아가세요.">
</head>
<body data-page="404">
  <div class="wrap">
    <p class="code">404 · NOT FOUND</p>
    <h1 data-i18n="e404.t">무대 뒤편입니다</h1>
    <p class="desc"><span data-i18n="e404.d">찾으시는 페이지가 없습니다. 공연장으로 다시 안내해 드리겠습니다.</span></p>
    <a href="https://insooni.com/" data-i18n="e404.cta">홈으로 돌아가기</a>
  </div>
  <!-- 404는 GitHub Pages가 깨진 경로에도 서빙하는 독립 페이지다.
       JS 번들에 의존하지 않고, 저장된 언어(insooni_lang)만 읽어 세 줄을 바꾼다.
       값은 i18n.js의 e404.* 와 반드시 일치시킨다. -->
  <script>
  (function () {
    try {
      if (JSON.parse(localStorage.getItem("insooni_lang") || "null") !== "en") return;
      document.documentElement.setAttribute("lang", "en");
      document.title = "Page not found | Insooni";
      var EN = {
        "e404.t": "You’re backstage",
        "e404.d": "That page isn’t here. Let us walk you back to the hall.",
        "e404.cta": "Back to home"
      };
      var nodes = document.querySelectorAll("[data-i18n]");
      for (var i = 0; i < nodes.length; i++) {
        var k = nodes[i].getAttribute("data-i18n");
        if (EN[k]) nodes[i].textContent = EN[k];
      }
    } catch (e) {}
  })();
  </script>
</body>
</html>
