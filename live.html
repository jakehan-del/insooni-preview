  <!-- 1. 이름표 — 공연 이름 + 지금 상태 한 줄 -->
  <section class="gig-id" aria-labelledby="gig-title">
    <p class="gig-when" id="gig-when" hidden></p>
    <h1 class="gig-title" id="gig-title">공연 도장</h1>
    <p class="gig-venue" id="gig-venue" hidden></p>
    <p class="gig-phase" id="gig-phase" role="status">공연 정보를 불러오고 있습니다</p>

    <p class="gig-slow" id="gig-slow" hidden>
      <span id="gig-slow-t"></span>

    </p>

  </section>

  <!-- 코드 입력 — 주소에 코드가 없고 지금 열린 공연도 없을 때, 또는 코드를 찾지 못했을 때 -->
  <form class="gig-code" id="gig-code" hidden novalidate>
    <label for="gig-code-in" id="gig-code-l">공연 코드</label>
    <input id="gig-code-in" type="text" inputmode="text" enterkeyhint="go" maxlength="5" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" aria-describedby="gig-code-h">
    <p class="form-hint" id="gig-code-h">QR 아래에 적힌 다섯 글자입니다.</p>
    <button type="submit" class="btn btn--solid gig-code-go" id="gig-code-go">열기</button>
    <p class="gig-code-msg" id="gig-code-msg" role="status"></p>
  </form>

  <!-- 2. 숫자 — 오늘 도장을 찍은 사람 수(서버가 센 그대로). 몇 초마다 새로 세는 영역이라 낭독하지 않는다 -->
  <section class="gig-count" id="gig-count" hidden aria-live="off">

    <p class="gig-zero" id="gig-zero" hidden></p>
    <p class="gig-count-note" id="gig-count-note"></p>
  </section>

    <svg class="gig-stamp-mark" viewBox="3 7.8 96.6 72.8" aria-hidden="true" focusable="false"><path fill="currentColor" d="M65.5 54 C58.5 40 46 29 27 25 C32.5 39.5 38.5 50 45.5 56.5 C52.5 63 61.5 61.5 65.5 54 Z"/><path fill="currentColor" d="M3 74 C3 63 16 55 35 54.4 C47 54 56 55.6 61 57.8 C59 50 59 40 62 31 C66 19.4 73 11.6 81 8.6 C85.2 7.4 88.8 8.4 90.6 11.4 L99.6 13.6 L90.4 16.2 C88.8 19.2 85.6 20.6 80.8 20.2 C76.6 19.6 72.8 24 69.8 33 C67.6 42 67.6 52 69.8 61 C70.8 64.5 70.4 68 66.5 71 C58.5 75 43 77.5 25.5 77.6 C15.5 77.6 8 76.6 3 74 Z M3 74 C10 69 20 61.5 33 56.8 C22 64.5 11 70.5 3 74 Z"/></svg>

    <!-- 공연장 이름과 '다녀옴'은 한 덩어리 — 큰 글자에서 '다녀옴'만 따로 떨어지지 않게(검토 4바퀴 23번) -->
    <span class="gig-stamp-vw"><span class="gig-stamp-v" id="gig-stamp-v"></span> <span class="gig-stamp-w" id="gig-stamp-w">다녀옴</span></span>
  </figure>

  <!-- 하단 바 — 이 화면의 유일한 채운 단추. 폰에서는 엄지가 닿는 아래에 고정, PC 에서는 도장 바로 아래 -->
  <div class="gig-bar" id="gig-bar" hidden>
    <!-- 도장이 실패하면 그 단추 바로 위에 — 바 뒤에 숨는 자리에 쓰면 객석에서는 '아무 일도 없다'(검토 3바퀴 10번) -->
    <p class="gig-bar-msg" id="gig-bar-msg" role="status"></p>
    <button type="button" class="btn btn--solid" id="gig-go"></button>
  </div>

  <!-- 성공의 낭독(가입 뒤 '도장을 찍고 … 보냈습니다' · 방명록 '받았습니다'). 실패·안내는 누른 자리 곁의
       .gig-act-msg · #gig-bar-msg 에 쓴다 — 한 번에 한 자리(gig.js msg) -->
  <p class="gig-msg" id="gig-msg" role="status" aria-live="polite"></p>

  <!-- 4. 응원 한마디 -->
  <section class="gig-act" id="gig-cheers" hidden aria-labelledby="gig-cheers-h">
    <h2 id="gig-cheers-h">응원 한마디</h2>
    <p class="gig-act-d" id="gig-cheers-d"></p>
    <div class="gig-chips" id="gig-chips"></div>
    <p class="gig-act-msg" id="gig-cheer-msg" role="status"></p>
  </section>

  <!-- 5. 앵콜 투표 — 후보가 없으면 섹션째 숨긴다 -->
  <section class="gig-act" id="gig-vote" hidden aria-labelledby="gig-vote-h">
    <h2 id="gig-vote-h">앵콜로 듣고 싶은 노래</h2>
    <p class="gig-act-d" id="gig-vote-d"></p>
    <p class="gig-act-n" id="gig-vote-n">앵콜곡은 무대에서 정합니다. 이 숫자는 여기 모인 마음입니다.</p>
    <div class="gig-songs" id="gig-songs" lang="ko"></div>
    <p class="gig-act-msg" id="gig-vote-msg" role="status"></p>
  </section>

  <!-- 6. 오늘 공연 방명록 — 사랑방 '공연·방송 후기' 게시판 글이 된다 -->
  <section class="gig-act" id="gig-gb" hidden aria-labelledby="gig-gb-h">
    <h2 id="gig-gb-h">오늘 공연 방명록</h2>
    <ol class="gig-gb-list" id="gig-gb-list" lang="ko"></ol>
    <p class="gig-gb-empty" id="gig-gb-empty" hidden>아직 올라온 글이 없습니다.</p>
    <p class="gig-gb-join" id="gig-gb-join" hidden><button type="button" class="btn btn--ghost" id="gig-gb-login"></button></p>
    <p class="gig-gb-note" id="gig-gb-note" hidden></p>
    <form class="gig-gb-form" id="gig-gb-form" hidden novalidate>
      <label for="gig-gb-ta" id="gig-gb-l">한 줄이면 충분합니다</label>
      <!-- 등급 문장은 글칸 위 — '남기기'가 글자 수 바로 아래에 와야 자판이 올라와도 칸과 단추가 함께 보인다(검토 3바퀴 11번) -->
      <p class="form-hint gig-gb-hint" id="gig-gb-hint"></p>
      <p class="form-hint gig-starts-h" id="gig-starts-h">누르면 글칸에 이어 붙습니다</p>
      <div class="gig-starts" id="gig-starts"></div>
      <textarea id="gig-gb-ta" rows="2" maxlength="500" aria-describedby="gig-gb-hint"></textarea>
      <p class="gig-gb-count" id="gig-gb-count" aria-live="off">0 / 500</p>
      <p class="gig-act-msg" id="gig-gb-err" role="status"></p>
      <button type="submit" class="btn btn--solid gig-gb-go" id="gig-gb-go">남기기</button>
    </form>
    <!-- 올린 뒤 — 폼 자리에 결과 한 줄 + '한 줄 더'. 결과 낭독은 #gig-msg 가 맡는다(두 번 읽지 않게) -->
    <p class="gig-gb-done" id="gig-gb-done"></p>
    <p class="gig-gb-again" id="gig-gb-again" hidden><button type="button" class="btn btn--text" id="gig-gb-again-b">한 줄 더 남기기</button></p>
    <p class="gig-gb-more"><a href="community.html#b=review" id="gig-gb-all">사랑방 공연·방송 후기에서 모두 보기 →</a></p>
  </section>
