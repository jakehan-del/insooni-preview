<!DOCTYPE html>
<html lang="ko" data-fs="1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 공연 화면 — 공연장 QR(https://insooni.com/live?e=코드)로만 들어오는 문서.
     검색에 나오지 않게 하고(공연이 끝나면 의미가 없다) sitemap 에도 넣지 않는다.
     어두운 객석 · 한 손 · 낮은 화면 밝기 · 느린 LTE · 카카오톡/카메라 인앱 브라우저가 기준이다.
     그래서 이 문서는 가볍다: 헤더·푸터·라디오·도입부·라우터가 없고, 싣는 스크립트는 셋뿐이다
     (설정 · 회원 핵심 board.js · 공연 화면 gig.js). 영어 사전은 영어로 볼 때만 gig.js 가 싣는다. -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080808">
<meta name="color-scheme" content="dark">
<title>공연 도장 · INSOONI</title>
<meta name="description" content="인순이 공연장에서 도장을 찍고 응원을 보내는 화면">
<meta property="og:title" content="공연 도장 · INSOONI">
<meta property="og:description" content="인순이 공연장에서 도장을 찍고 응원을 보내는 화면">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://vxrazyiqvdwgvgpkkitm.supabase.co" crossorigin>
<!-- 글자 크기·언어는 그리기 전에 — 다 그린 뒤 바꾸면 화면이 한 번 튄다(main.js 와 같은 키·같은 값) -->
<script>try{var f=parseInt(localStorage.getItem("insooni_fs"),10);if(f>=0&&f<3){document.documentElement.style.fontSize=[17,19,21][f]+"px";document.documentElement.setAttribute("data-fs",String(f+1))}if(JSON.parse(localStorage.getItem("insooni_lang")||"null")==="en")document.documentElement.setAttribute("lang","en")}catch(e){}</script>
<link rel="stylesheet" href="assets/fonts/body.css?v29e63548">
<link rel="stylesheet" href="assets/fonts/mono.css?v29e63548">
<link rel="stylesheet" href="assets/css/style.min.css?v29e63548">
</head>
<body data-page="live">
<a class="skip-link" href="#main">본문 바로가기</a>

<header class="gig-head">
  <a class="gig-brand" href="/" aria-label="인순이 공식 사이트 홈">INSOONI</a>
  <div class="header-tools">
    <button class="fs-toggle" type="button" aria-label="글자 크기 바꾸기 — 지금 보통"><span class="fs-a">가</span><span class="fs-b">가</span></button>
    <button class="lang-toggle" type="button" aria-label="Switch to English">EN</button>
  </div>
</header>

<main id="main" class="gig">
  <!-- 운영자가 공개 전(draft) 공연을 미리 보는 중일 때만 -->
  <p class="gig-preview" id="gig-preview" hidden></p>

  <!-- 1. 이름표 — 공연 이름 + 지금 상태 한 줄 -->
  <section class="gig-id" aria-labelledby="gig-title">
    <p class="gig-when" id="gig-when" hidden></p>
    <h1 class="gig-title" id="gig-title">공연 도장</h1>
    <p class="gig-venue" id="gig-venue" hidden></p>
    <p class="gig-phase" id="gig-phase" role="status">공연 정보를 불러오고 있습니다</p>
    <!-- 로그아웃 + 카카오 없음(스위치 꺼짐·방금 실패) — 가입이 이메일 왕복이라는 사실을 미리 한 줄로 -->
    <p class="gig-mailnote" id="gig-mailnote" hidden></p>
    <p class="gig-slow" id="gig-slow" hidden>
      <span id="gig-slow-t">연결이 느립니다.</span>
      <button type="button" class="btn btn--ghost gig-retry" id="gig-retry">다시 불러오기</button>
    </p>
    <p class="gig-off-go" id="gig-off-go" hidden><a href="community.html" id="gig-off-a">사랑방으로</a></p>
  </section>

  <!-- 코드 입력 — 주소에 코드가 없고 지금 열린 공연도 없을 때, 또는 코드를 찾지 못했을 때 -->
  <form class="gig-code" id="gig-code" hidden novalidate>
    <label for="gig-code-in" id="gig-code-l">공연 코드</label>
    <input id="gig-code-in" type="text" inputmode="text" maxlength="5" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" aria-describedby="gig-code-h">
    <p class="form-hint" id="gig-code-h">QR 아래에 적힌 다섯 글자입니다.</p>
    <button type="submit" class="btn btn--solid gig-code-go" id="gig-code-go">열기</button>
    <p class="gig-code-msg" id="gig-code-msg" role="status"></p>
  </form>

  <!-- 2. 숫자 — 오늘 도장을 찍은 사람 수(서버가 센 그대로). 몇 초마다 새로 세는 영역이라 낭독하지 않는다 -->
  <section class="gig-count" id="gig-count" hidden aria-live="off">
    <p class="gig-count-row" id="gig-count-row"><span class="gig-n" id="gig-n">0</span> <span class="gig-count-c" id="gig-count-c">명이 오늘 도장을 찍었습니다</span></p>
    <p class="gig-zero" id="gig-zero" hidden></p>
    <p class="gig-count-note" id="gig-count-note"></p>
  </section>

  <!-- 3. 도장 — 찍은 뒤에만. 일련번호·순번은 쓰지 않는다(순위가 아니다) -->
  <figure class="gig-stamp" id="gig-stamp" role="img" hidden>
    <svg class="gig-stamp-mark" viewBox="3 7.8 96.6 72.8" aria-hidden="true" focusable="false"><path fill="currentColor" d="M65.5 54 C58.5 40 46 29 27 25 C32.5 39.5 38.5 50 45.5 56.5 C52.5 63 61.5 61.5 65.5 54 Z"/><path fill="currentColor" d="M3 74 C3 63 16 55 35 54.4 C47 54 56 55.6 61 57.8 C59 50 59 40 62 31 C66 19.4 73 11.6 81 8.6 C85.2 7.4 88.8 8.4 90.6 11.4 L99.6 13.6 L90.4 16.2 C88.8 19.2 85.6 20.6 80.8 20.2 C76.6 19.6 72.8 24 69.8 33 C67.6 42 67.6 52 69.8 61 C70.8 64.5 70.4 68 66.5 71 C58.5 75 43 77.5 25.5 77.6 C15.5 77.6 8 76.6 3 74 Z M3 74 C10 69 20 61.5 33 56.8 C22 64.5 11 70.5 3 74 Z"/></svg>
    <span class="gig-stamp-d" id="gig-stamp-d"></span>
    <span class="gig-stamp-v" id="gig-stamp-v"></span>
    <span class="gig-stamp-w" id="gig-stamp-w">다녀옴</span>
  </figure>

  <!-- 하단 바 — 이 화면의 유일한 채운 단추. 폰에서는 엄지가 닿는 아래에 고정, PC 에서는 도장 바로 아래 -->
  <div class="gig-bar" id="gig-bar" hidden>
    <button type="button" class="btn btn--solid" id="gig-go"></button>
  </div>

  <!-- 본인 행동의 결과만(도장·응원·투표·방명록) -->
  <p class="gig-msg" id="gig-msg" role="status" aria-live="polite"></p>

  <!-- 4. 응원 한마디 -->
  <section class="gig-act" id="gig-cheers" hidden aria-labelledby="gig-cheers-h">
    <h2 id="gig-cheers-h">응원 한마디</h2>
    <p class="gig-act-d" id="gig-cheers-d"></p>
    <div class="gig-chips" id="gig-chips"></div>
  </section>

  <!-- 5. 앵콜 투표 — 후보가 없으면 섹션째 숨긴다 -->
  <section class="gig-act" id="gig-vote" hidden aria-labelledby="gig-vote-h">
    <h2 id="gig-vote-h">앵콜로 듣고 싶은 노래</h2>
    <p class="gig-act-d" id="gig-vote-d"></p>
    <p class="gig-act-n" id="gig-vote-n">앵콜곡은 무대에서 정합니다. 이 숫자는 여기 모인 마음입니다.</p>
    <div class="gig-songs" id="gig-songs" lang="ko"></div>
  </section>

  <!-- 6. 오늘 공연 방명록 — 사랑방 '공연·방송 후기' 게시판 글이 된다 -->
  <section class="gig-act" id="gig-gb" hidden aria-labelledby="gig-gb-h">
    <h2 id="gig-gb-h">오늘 공연 방명록</h2>
    <ol class="gig-gb-list" id="gig-gb-list" lang="ko"></ol>
    <p class="gig-gb-empty" id="gig-gb-empty" hidden>아직 올라온 글이 없습니다.</p>
    <p class="gig-gb-join" id="gig-gb-join" hidden><button type="button" class="btn btn--ghost" id="gig-gb-login"></button></p>
    <p class="gig-gb-note" id="gig-gb-note" hidden></p>
    <form class="gig-gb-form" id="gig-gb-form" hidden novalidate>
      <label for="gig-gb-ta" id="gig-gb-l">한 줄이면 충분합니다</label>
      <p class="form-hint gig-starts-h" id="gig-starts-h">누르면 글칸에 이어 붙습니다</p>
      <div class="gig-starts" id="gig-starts"></div>
      <textarea id="gig-gb-ta" rows="3" maxlength="500"></textarea>
      <p class="gig-gb-count" id="gig-gb-count" aria-live="off">0 / 500</p>
      <p class="form-hint gig-gb-hint" id="gig-gb-hint"></p>
      <button type="submit" class="btn btn--solid gig-gb-go" id="gig-gb-go">남기기</button>
    </form>
    <!-- 올린 뒤 — 폼 자리에 결과 한 줄 + '한 줄 더'. 결과 낭독은 #gig-msg 가 맡는다(두 번 읽지 않게) -->
    <p class="gig-gb-done" id="gig-gb-done"></p>
    <p class="gig-gb-again" id="gig-gb-again" hidden><button type="button" class="btn btn--text" id="gig-gb-again-b">한 줄 더 남기기</button></p>
    <p class="gig-gb-more"><a href="community.html#b=review" id="gig-gb-all">사랑방 공연·방송 후기에서 모두 보기 →</a></p>
  </section>

  <!-- 9. 꼬리 -->
  <nav class="gig-tail" aria-label="다른 곳으로" id="gig-tail">
    <a href="community.html" id="gig-t1">사랑방으로</a>
    <a href="privacy.html" id="gig-t2">개인정보처리방침</a>
    <a href="terms.html" id="gig-t3">이용약관</a>
    <button type="button" class="lang-toggle gig-tail-lang">English</button>
  </nav>
</main>

<script src="assets/js/config.js?v29e63548" defer></script>
<script src="assets/js/board.min.js?v29e63548" defer></script>
<script src="assets/js/gig.min.js?v29e63548" defer></script>
</body>
</html>
